# Diagnostic run: keep common anchors, validation gallery and the paper loss.
defaults:
  - taf_adapter
  - _self_

data:
  root_dir: /ssdg/spl_yeongyoo/taf_dataset
  window_size: 5
  frame_cache_enabled: false  # Unfrozen ViT features must not be cached.
  sensor_mmap_enabled: true
  split_seed: 42
  split_unit: sequence

tactile_encoder:
  pretrained: true
  freeze_backbone: false
  dropout: 0.2  # Temporal Transformer dropout.

loss:
  nce_mode: paper
  temperature: 0.07
  lambda_quant: 1.0
  lambda_recon: 1.0

training:
  batch_sampler: epoch_shuffled  # Requires the accompanying source patch.
  batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  max_steps: 40000
  num_workers: 2
  eval_num_workers: 0
  prefetch_factor: 1
  seed: 42
  amp: true
  grad_clip_norm: 1.0
  min_same_episode_window_gap: 20
  validate_every: 500
  validation_batches: 50
  save_every: 1000
  output_dir: outputs/comparison/alignment_test
  resume: null

comparison:
  enabled: true
  manifest: metadata/manifest.parquet
  sampling_seed: 42
  gallery_seed: 42
  gallery_max_pairs: 256
  min_anchor_gap: 20

alignment_eval:
  enabled: true
  retrieval_every_n_steps: 500
  retrieval_max_pairs: 256
  min_window_start_gap: 20
  random_seed: 42
  run_on_training_end: true

wandb:
  enabled: true
  project: TaF-Adapter
  name: AlignmentRecovery
  group: alignment_recovery
  tags: [taf-vla, alignment-test, vit-unfrozen, epoch-shuffled]

trainctl:
  enabled: true
