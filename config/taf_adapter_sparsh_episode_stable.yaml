defaults:
  - taf_adapter_sparsh_episode
  - _self_

vq:
  initialization: kmeans
  kmeans_samples: 16384
  kmeans_iters: 20
  kmeans_seed: 42

training:
  learning_rate: 0.0001
  max_steps: 40000
  resume: null
  scheduler:
    type: cosine
    warmup_steps: 500
    warmup_start_factor: 0.01
    min_lr: 0.00001
  output_dir: outputs/comparison/sparsh_episode_stable_runs

wandb:
  name: SparshDINO-EpisodeSplit-Stable
  group: sparsh_episode_stability
