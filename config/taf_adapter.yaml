defaults:
  - taf_adapter_schema
  - _self_

# TaF-Adapter reproduction config.
# Except for window_size=5 and the Eq. (1)--(11) structure, numeric values below
# are initial experimental choices because the paper does not publish them.

data:
  root_dir: "/home/yeongyoo/03_Dataset/08_TaFVLA/TaF-Dataset"
  window_size: 5                 # The paper reports N=5.
  stride: 1
  image_size: [224, 224]
  max_sequences: null
  sensor_types: null
  split_seed: 42
  split_unit: "sequence"         # "sequence" or "episode"; never split windows.
  validation_fraction: 0.1
  skip_invalid_sequences: false  # Training refuses silently skipped sequences.
  timestamp_cache_enabled: true
  # null -> ${XDG_CACHE_HOME:-~/.cache}/taf-vla/video_timestamps/
  timestamp_cache_dir: null
  sensor_arrow_conversion: true  # Native Arrow flatten; false restores legacy conversion.
  video_cache_max_entries: 2     # Bounded decoder LRU per worker; 0 closes each call.
  batch_group_reads: true       # Group reads inside a batch, then restore sampler order.
  frame_cache_max_open_files: 8 # Bounded mmap handles per worker.
  sensor_cache_max_mb: 256       # Maximum per DataLoader worker.
  sensor_mmap_enabled: true      # Reuse persistent decompressed sensors; build missing files lazily.
  sensor_mmap_dir: "outputs/sensor_mmap"
  sensor_mmap_rebuild: false     # Publish a new generation; preserve existing generations.
  sensor_mmap_max_open_files: 16 # Each source has three read-only NPY mappings.
  sensor_mmap_batch_rows: 8192   # Bounded Arrow batches during cache generation.
  frame_cache_enabled: false     # Precompute frozen ViT outputs shared by all N.
  frame_cache_dir: null          # null -> outputs/frame_cache
  frame_cache_rebuild: false     # Force regeneration after manual inspection.
  frame_cache_batch_size: 32
  show_initialization_progress: true
  alignment_decode_windows_per_episode: 1
  normalization_eps: 1.0e-6
  normalization_chunk_frames: 8192

force_encoder:
  hidden_dim: 512
  pressure_latent_dim: 128
  force_latent_dim: 128
  mlp_layers: 2

vq:
  pressure_codebook_size: 512
  force_codebook_size: 512
  commitment_beta: 0.25

tactile_encoder:
  # Verified in the installed timm 1.0.30 registry. AugReg ImageNet-21k
  # pretraining followed by ImageNet-1k fine-tuning; exact backbone/init/freeze
  # choices are not disclosed by TaF-VLA.
  backbone: "vit_small_patch16_224.augreg_in21k_ft_in1k"
  pretrained: true
  freeze_backbone: true
  transformer_dim: 256
  transformer_layers: 2
  num_heads: 4
  dropout: 0.1
  max_window_size: 20
  backbone_chunk_frames: 0       # Set e.g. 64 for bounded raw-image ViT memory.

loss:
  lambda_quant: 1.0
  lambda_recon: 1.0
  temperature: 0.07
  # "paper" implements Eq. (10), tactile->force only. "symmetric" averages
  # tactile->force and force->tactile, matching the prose description.
  nce_mode: "paper"

training:
  batch_size: 512
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_steps: 25000
  num_workers: 4
  eval_num_workers: 0            # Validation and alignment; avoid extra worker pools by default.
  prefetch_factor: 1             # Bound queued image batches for large N and limited host RAM.
  seed: 42
  amp: true
  grad_clip_norm: 1.0
  # TTY: fixed-position tqdm dashboard; non-TTY: periodic plain-text summary.
  log_every: 20
  validate_every: 500
  validation_batches: 50
  save_every: 1000
  output_dir: "outputs/taf_adapter"
  resume: null
  # Gradient accumulation does not increase the number of InfoNCE negatives.
  min_same_episode_window_gap: 5

wandb:
  enabled: true
  project: "TaF-Adapter"
  entity: null
  name: null
  group: null
  tags: ["taf-vla", "pretraining"]
  mode: "online"
  # Native scalar histories use global_step; README explains overlay panels.
  # W&B and metrics.jsonl both retain codebook stability diagnostics.
  log_every: 20
  watch_model: false

alignment_eval:
  enabled: true
  # 0 disables optimizer-step retrieval; step evaluations never visualize.
  retrieval_every_n_steps: 1000
  retrieval_every_n_epochs: 1
  visualize_every_n_epochs: 5
  retrieval_max_pairs: 256
  visualization_max_pairs: 64
  # 실제 적용 간격은 temporal overlap 방지를 위해 max(이 값, window_size)이다.
  min_window_start_gap: 5
  random_seed: 42
  run_on_training_end: true
  save_local_figures: true

check:
  overfit_steps: 100
  skip_overfit: false
  no_pretrained: false
  # Keep T=5 last so its model can be reused by the synthetic overfit check.
  window_sizes: [1, 3, 10, 5]

comparison:
  enabled: false
  manifest: null
  sampling_seed: 42
  gallery_seed: 42
  gallery_max_pairs: 256
  min_anchor_gap: 20
  window_sizes: [1, 3, 5, 7, 10, 20]
  training_seeds: [42, 43, 44]

trainctl:
  enabled: true
  performance:
    enabled: true
    detailed_profiling: false   # CUDA events only when explicitly enabled.
    log_every: 20
    monitor_cpu_memory: true
    monitor_gpu_memory: true
    monitor_throughput: true
    monitor_data_loading: true
    monitor_cache: false        # Shared worker counters add per-sample locking.
    monitor_gpu_utilization: false
    warnings:
      enabled: false
      data_wait_ratio_threshold: 0.5
      stall_timeout_seconds: 600
      warning_cooldown_seconds: 1800
      cpu_rss_warning_gib: null
      gpu_reserved_warning_gib: null
      cache_hit_rate_threshold: 0.1
      send_to_trainctl: false

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
